[project]
name = "trapvrij-lifts"
version = "0.1.0"
description = "Live lift status for Trapvrij: SIRI-FM feed -> Cloudflare KV (runs on Daan's home server)"
requires-python = ">=3.12"
dependencies = ["lxml>=5.3", "pyzmq>=26", "requests>=2.32"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]

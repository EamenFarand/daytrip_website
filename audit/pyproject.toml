[project]
name = "stepfree-audit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "polars>=1.44.2",
    "pyzmq>=27.2.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
